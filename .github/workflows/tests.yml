name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  server:
    name: server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: node tests/test-api.mjs
  browser:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install && npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/test-app-ui.mjs
